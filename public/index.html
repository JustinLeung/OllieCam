<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OllieCam</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 16px;
      color: #e0e0e0;
    }
    .video-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      background: #000;
    }
    video {
      width: 100%;
      display: block;
      cursor: pointer;
    }
    video.hidden { display: none; }
    .status {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.6);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.5s infinite;
    }
    .dot.connected { background: #22c55e; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .info {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #888;
    }
    .mute-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0,0,0,0.6);
      border: none;
      color: #eee;
      font-size: 1.4rem;
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
      line-height: 1;
    }
    .mute-btn:hover { background: rgba(0,0,0,0.8); }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.3);
      cursor: pointer;
      z-index: 2;
    }
    .play-overlay.hidden { display: none; }
    .play-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-btn:hover { background: #fff; }
    .play-btn::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      margin-left: 4px;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      border-left: 26px solid #1a1a2e;
    }
    .snapshot {
      width: 100%;
      display: block;
    }
    .snapshot.hidden { display: none; }
    .bark-alert {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(239, 68, 68, 0.9);
      color: white;
      text-align: center;
      padding: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transform: translateY(-100%);
      transition: transform 0.3s ease;
      z-index: 1;
    }
    .bark-alert.active { transform: translateY(0); }
    .bark-alert.whine { background: rgba(234, 179, 8, 0.9); }
    .bark-log {
      width: 100%;
      max-width: 900px;
      margin-top: 16px;
    }
    .bark-log h3 {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 8px;
    }
    .bark-log ul {
      list-style: none;
      max-height: 150px;
      overflow-y: auto;
      font-size: 0.8rem;
      color: #aaa;
    }
    .bark-log li {
      padding: 4px 0;
      border-bottom: 1px solid #2a2a3e;
    }
    .error-msg {
      color: #ef4444;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>OllieCam</h1>
  <div class="video-container">
    <img id="snapshot" class="snapshot" alt="OllieCam snapshot">
    <video id="video" muted playsinline class="hidden"></video>
    <div class="play-overlay" id="play-overlay">
      <button class="play-btn" title="Start live stream"></button>
    </div>
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="status-text">Paused</span>
    </div>
    <div class="bark-alert" id="bark-alert"></div>
    <button class="mute-btn" id="mute-btn" title="Toggle audio">🔇</button>
  </div>
  <p class="info" id="info">Waiting for stream...</p>
  <p class="error-msg" id="error"></p>
  <div class="bark-log" id="bark-log">
    <h3>Recent Activity</h3>
    <ul id="bark-list"></ul>
  </div>

  <script>
    const video = document.getElementById('video');
    const snapshot = document.getElementById('snapshot');
    const playOverlay = document.getElementById('play-overlay');
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('status-text');
    const info = document.getElementById('info');
    const errorEl = document.getElementById('error');
    const muteBtn = document.getElementById('mute-btn');
    const barkAlert = document.getElementById('bark-alert');
    const barkList = document.getElementById('bark-list');
    const streamUrl = '/stream/stream.m3u8';

    // Load snapshot on page load
    function loadSnapshot() {
      fetch('/snapshot')
        .then(res => {
          if (res.ok) return res.blob();
          throw new Error();
        })
        .then(blob => { snapshot.src = URL.createObjectURL(blob); })
        .catch(() => { info.textContent = 'Waiting for camera...'; setTimeout(loadSnapshot, 2000); });
    }
    loadSnapshot();

    // Play/pause state
    let hlsInstance = null;
    let isLive = false;

    function goLive() {
      playOverlay.classList.add('hidden');
      snapshot.classList.add('hidden');
      video.classList.remove('hidden');
      isLive = true;

      if (hlsInstance) {
        // Resume existing stream — seek to live edge
        video.play();
        if (hlsInstance.liveSyncPosition) {
          video.currentTime = hlsInstance.liveSyncPosition;
        }
        setConnected();
      } else {
        waitForStream();
      }
    }

    function pauseStream() {
      isLive = false;
      video.pause();
      video.classList.add('hidden');
      snapshot.classList.remove('hidden');
      playOverlay.classList.remove('hidden');
      dot.classList.remove('connected');
      statusText.textContent = 'Paused';
      info.textContent = 'Click play to resume live stream';
      loadSnapshot(); // refresh the still frame
    }

    playOverlay.addEventListener('click', goLive);
    video.addEventListener('click', pauseStream);

    // --- Audio context (initialized on first unmute click) ---
    let audioCtx, analyser, gainNode, audioInitialized = false;

    function initAudio() {
      if (audioInitialized) return;
      audioInitialized = true;

      audioCtx = new AudioContext();
      audioCtx.resume();
      const source = audioCtx.createMediaElementSource(video);

      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;

      gainNode = audioCtx.createGain();
      gainNode.gain.value = 1; // unmuted — user just clicked

      // source -> analyser -> gain -> speakers
      source.connect(analyser);
      analyser.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      video.muted = false; // audio now routed through Web Audio
      startBarkDetection();
    }

    muteBtn.addEventListener('click', () => {
      if (!audioInitialized) {
        initAudio();
        muteBtn.textContent = '\u{1F50A}';
        return;
      }
      const muted = gainNode.gain.value === 0;
      gainNode.gain.value = muted ? 1 : 0;
      muteBtn.textContent = muted ? '\u{1F50A}' : '\u{1F507}';
    });

    // --- Sound detection via frequency analysis ---
    function startBarkDetection() {
      const bufLen = analyser.frequencyBinCount;
      const freqData = new Float32Array(bufLen);
      const sampleRate = audioCtx.sampleRate;
      const binHz = sampleRate / analyser.fftSize;

      // Bark band: 500–3000 Hz (short loud bursts)
      const barkLo = Math.floor(500 / binHz);
      const barkHi = Math.ceil(3000 / binHz);

      // Whine band: 300–5000 Hz (sustained tonal energy)
      const whineLo = Math.floor(300 / binHz);
      const whineHi = Math.ceil(5000 / binHz);

      const history = [];
      let lastDetect = 0;
      let whineFrames = 0;       // consecutive frames with whine-level energy
      const WHINE_FRAMES = 15;   // ~1.5s sustained to trigger whine detection

      setInterval(() => {
        analyser.getFloatFrequencyData(freqData); // dB values

        // Mean energy in bark band
        let barkE = 0;
        for (let i = barkLo; i <= barkHi; i++) barkE += freqData[i];
        barkE /= (barkHi - barkLo + 1);

        // Mean energy in whine band
        let whineE = 0;
        for (let i = whineLo; i <= whineHi; i++) whineE += freqData[i];
        whineE /= (whineHi - whineLo + 1);

        // Mean total energy (baseline)
        let totalE = 0;
        for (let i = 0; i < bufLen; i++) totalE += freqData[i];
        totalE /= bufLen;

        history.push(totalE);
        if (history.length > 50) history.shift(); // ~5s rolling window
        const baseline = history.reduce((a, b) => a + b) / history.length;

        const now = Date.now();
        const barkSpike = barkE - baseline;
        const whineSpike = whineE - baseline;

        // Bark: sharp spike in bark band
        if (barkSpike > 15 && barkE > -45 && now - lastDetect > 3000) {
          lastDetect = now;
          whineFrames = 0;
          onSoundDetected('bark', Math.min(barkSpike / 30, 1));
        }
        // Whine/cry: sustained elevated energy in whine band (lower threshold)
        else if (whineSpike > 8 && whineE > -50) {
          whineFrames++;
          if (whineFrames >= WHINE_FRAMES && now - lastDetect > 5000) {
            lastDetect = now;
            whineFrames = 0;
            onSoundDetected('whine', Math.min(whineSpike / 20, 1));
          }
        } else {
          whineFrames = Math.max(0, whineFrames - 1); // decay slowly to tolerate brief gaps
        }
      }, 100);
    }

    function onSoundDetected(type, confidence) {
      showAlert(type);
      fetch('/bark', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, confidence }),
      }).catch(() => {});
    }

    // --- Alert UI ---
    let alertTimeout, lastAlertTime = 0;

    function showAlert(type) {
      const now = Date.now();
      if (now - lastAlertTime < 2000) return; // dedupe local + SSE
      lastAlertTime = now;

      barkAlert.textContent = type === 'whine' ? 'Whining detected!' : 'Bark detected!';
      barkAlert.classList.toggle('whine', type === 'whine');
      barkAlert.classList.add('active');
      clearTimeout(alertTimeout);
      alertTimeout = setTimeout(() => barkAlert.classList.remove('active'), 3000);

      const li = document.createElement('li');
      const label = type === 'whine' ? 'Whine' : 'Bark';
      li.textContent = label + ' at ' + new Date().toLocaleTimeString();
      barkList.prepend(li);
      while (barkList.children.length > 20) barkList.removeChild(barkList.lastChild);
    }

    // --- SSE: receive bark events from server (other clients' detections) ---
    const evtSource = new EventSource('/events');
    evtSource.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'bark' || data.type === 'whine') showAlert(data.type);
    };

    // --- Stream connection ---
    function setConnected() {
      dot.classList.add('connected');
      statusText.textContent = 'LIVE';
      info.textContent = 'Stream is live \u2014 click \u{1F507} to enable audio & bark detection';
      errorEl.style.display = 'none';
    }

    function setDisconnected(msg) {
      dot.classList.remove('connected');
      statusText.textContent = 'Offline';
      info.textContent = msg || 'Stream offline';
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    function startStream() {
      if (Hls.isSupported()) {
        hlsInstance = new Hls({
          liveSyncDurationCount: 4,
          liveMaxLatencyDurationCount: 8,
          lowLatencyMode: false,
          backBufferLength: 30,
        });
        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play();
          setConnected();
        });
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            setDisconnected('Reconnecting...');
            hlsInstance.destroy();
            hlsInstance = null;
            setTimeout(startStream, 3000);
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', () => {
          video.play();
          setConnected();
        });
        video.addEventListener('error', () => {
          setDisconnected('Reconnecting...');
          setTimeout(startStream, 3000);
        });
      } else {
        showError('Your browser does not support HLS streaming.');
      }
    }

    function waitForStream() {
      fetch(streamUrl)
        .then(res => {
          if (res.ok) startStream();
          else setTimeout(waitForStream, 2000);
        })
        .catch(() => setTimeout(waitForStream, 2000));
    }
  </script>
</body>
</html>
