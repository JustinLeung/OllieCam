name: OllieCam
options:
  bundleIdPrefix: com.olliecam
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  OllieCam:
    type: application
    platform: iOS
    sources: [OllieCam]
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UILaunchStoryboardName: ""
        INFOPLIST_KEY_NSCameraUsageDescription: "OllieCam needs camera access for local testing"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "OllieCam needs microphone access for local testing"
    postBuildScripts:
      - script: |
          if [ -x "$(command -v swiftlint)" ]; then
            swiftlint
          fi
        name: SwiftLint
